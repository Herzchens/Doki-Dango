plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'dev.dokidango.bharness'

    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    buildToolsVersion = '36.1.0'

    defaultConfig {
        // Disposable B-spike identity only. This is not Doki-Dango's production application ID.
        applicationId = 'dev.dokidango.bharness'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        debug {
            debuggable = true
        }
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:26.0.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
}
