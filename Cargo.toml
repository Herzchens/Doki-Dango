[workspace]
members = [
    "apps/host",
    "apps/ui",
    "crates/platform-windows",
]
exclude = [
    "tests/harnesses/windows-notification-listener-rust/rust",
    "tests/harnesses/windows-credential-protection-rust",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.4.2", features = ["json"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
