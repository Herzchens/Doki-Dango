[workspace]
members = [
    "apps/host",
    "crates/platform-windows",
]
exclude = [
    "tests/harnesses/windows-notification-listener-rust/rust",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_System_Com",
] }
