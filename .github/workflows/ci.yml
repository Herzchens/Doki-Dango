name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse and hygiene
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          $files = @(Get-ChildItem -LiteralPath .\scripts -Recurse -File -Filter '*.ps1')
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($parseError in @($errors)) {
                  Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

          Write-Host "Parsed $($files.Count) PowerShell scripts with Windows PowerShell 5.1."

      - name: Parse PowerShell with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem -LiteralPath .\scripts -Recurse -File -Filter '*.ps1')
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($parseError in @($errors)) {
                  Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

          Write-Host "Parsed $($files.Count) PowerShell scripts with PowerShell 7."

      - name: Check tracked-file and secret hygiene
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $forbidden = @(
              $tracked | Where-Object {
                  $_ -match '(^|/)(AGENTS\.md|PLAN\.md|google-services\.json)$' -or
                  $_ -match '\.(pfx|jks|keystore)$'
              }
          )

          if ($forbidden.Count -gt 0) {
              Write-Host '::error::Forbidden internal/secret-bearing files are tracked:'
              $forbidden | ForEach-Object {
                  Write-Host ("::error file={0}::{0}" -f $_)
              }
              exit 1
          }

          $privateKeyPattern = '-----BEGIN ' + '(RSA |EC |OPENSSH )?' + 'PRIVATE KEY-----'
          $apiKeyPattern = 'AI' + 'za[0-9A-Za-z_-]{20,}'
          $oauthPattern = 'ya' + '29\.[0-9A-Za-z._-]+'
          $secretPattern = "$privateKeyPattern|$apiKeyPattern|$oauthPattern"

          $matches = @(& git grep -I -n -E -- $secretPattern 2>$null)
          $grepExit = $LASTEXITCODE

          if ($grepExit -eq 0) {
              Write-Host '::error::Potential committed secret material detected.'
              $matches | ForEach-Object { Write-Host "::error::$_" }
              exit 1
          }

          if ($grepExit -ne 1) {
              throw "git grep failed with exit code $grepExit"
          }

          Write-Host 'Tracked-file and secret hygiene checks passed.'
          exit 0

  windows-dotnet-reference:
    name: Windows .NET reference build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'

      - name: Build Windows notification reference
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test\windows-notification-reference\Build-Unpackaged.ps1

  android-fcm-harness:
    name: Android FCM harness build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          cache: gradle

      - name: Install required Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) {
              $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
              $env:ANDROID_HOME
          } else {
              throw 'ANDROID_SDK_ROOT/ANDROID_HOME is not configured on the runner.'
          }

          $sdkManager = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'cmdline-tools') `
              -Recurse `
              -File `
              -Filter 'sdkmanager.bat' |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $sdkManager) {
              throw "sdkmanager.bat not found under $sdkRoot"
          }

          & $sdkManager.FullName `
              "--sdk_root=$sdkRoot" `
              'platform-tools' `
              'platforms;android-36.1' `
              'build-tools;36.1.0'

          if ($LASTEXITCODE -ne 0) {
              throw "sdkmanager failed with exit code $LASTEXITCODE"
          }

          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Android FCM harness
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test\android-fcm\Build.ps1


  windows-rust-harness:
    name: Windows Rust notification harness build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Format and lint
        shell: pwsh
        run: |
          rustup component add rustfmt clippy --toolchain 1.99.0
          cargo fmt --manifest-path .\tests\harnesses\windows-notification-listener-rust\rust\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\tests\harnesses\windows-notification-listener-rust\rust\Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Rust notification harness
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test\windows-notification-rust\Build.ps1


  windows-host:
    name: Windows Host workspace
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup component add rustfmt clippy --toolchain 1.99.0
          rustc --version
          cargo --version

      - name: Format, lint, test, and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --workspace --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production FCM sender harness
        shell: pwsh
        run: |
          cargo build --locked --release -p doki-dango-host --example production_fcm_sender
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Credential protection runtime gate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test\windows-host\Test-CredentialProtection.ps1


  windows-package:
    name: Windows package build
    needs: windows-host
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Validate package identity
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -LiteralPath .\packaging\windows\AppxManifest.xml -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $ns.AddNamespace('uap', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')
          $ns.AddNamespace('desktop', 'http://schemas.microsoft.com/appx/manifest/desktop/windows10')

          $identity = $manifest.SelectSingleNode('/f:Package/f:Identity', $ns)
          $applications = @($manifest.SelectNodes('/f:Package/f:Applications/f:Application', $ns))
          $hostApplication = $manifest.SelectSingleNode('/f:Package/f:Applications/f:Application[@Id="Host"]', $ns)
          $uiApplication = $manifest.SelectSingleNode('/f:Package/f:Applications/f:Application[@Id="UI"]', $ns)
          $uiVisualElements = if ($uiApplication) {
              $uiApplication.SelectSingleNode('uap:VisualElements', $ns)
          } else {
              $null
          }
          $properties = $manifest.SelectSingleNode('/f:Package/f:Properties', $ns)
          $startupExtension = $manifest.SelectSingleNode(
              '/f:Package/f:Applications/f:Application[@Id="Host"]/f:Extensions/desktop:Extension[@Category="windows.startupTask"]',
              $ns
          )
          $startupTask = if ($startupExtension) {
              $startupExtension.SelectSingleNode('desktop:StartupTask', $ns)
          } else {
              $null
          }

          if ($identity.Name -ne 'ItzHerzchen.DokiDango') { throw "Unexpected package name: $($identity.Name)" }
          if ($identity.Publisher -ne 'CN=ItzHerzchen') { throw "Unexpected publisher: $($identity.Publisher)" }
          if ($applications.Count -ne 2) { throw "Unexpected application count: $($applications.Count)" }
          if (-not $hostApplication) { throw 'Missing Host application entry.' }
          if ($hostApplication.Executable -ne 'dokidango.exe') { throw "Unexpected Host executable: $($hostApplication.Executable)" }
          if ($hostApplication.EntryPoint -ne 'Windows.FullTrustApplication') { throw "Unexpected Host entry point: $($hostApplication.EntryPoint)" }
          if (-not $uiApplication) { throw 'Missing UI application entry.' }
          if ($uiApplication.Executable -ne 'dokidango-ui.exe') { throw "Unexpected UI executable: $($uiApplication.Executable)" }
          if ($uiApplication.EntryPoint -ne 'Windows.FullTrustApplication') { throw "Unexpected UI entry point: $($uiApplication.EntryPoint)" }
          if (-not $uiVisualElements) { throw 'Missing UI visual elements.' }
          if ($uiVisualElements.AppListEntry -ne 'none') { throw "UI app list entry must be hidden: $($uiVisualElements.AppListEntry)" }
          if ($properties.DisplayName -ne 'Doki-Dango') { throw "Unexpected display name: $($properties.DisplayName)" }
          if ($properties.PublisherDisplayName -ne 'ItzHerzchen') { throw "Unexpected publisher display name: $($properties.PublisherDisplayName)" }
          if (-not $startupExtension) { throw 'Missing windows.startupTask extension.' }
          if ($startupExtension.Executable -ne 'dokidango.exe') { throw "Unexpected startup executable: $($startupExtension.Executable)" }
          if ($startupExtension.EntryPoint -ne 'Windows.FullTrustApplication') { throw "Unexpected startup entry point: $($startupExtension.EntryPoint)" }
          if (-not $startupTask) { throw 'Missing desktop:StartupTask.' }
          if ($startupTask.TaskId -ne 'DokiDangoHostStartup') { throw "Unexpected startup task ID: $($startupTask.TaskId)" }
          if ($startupTask.Enabled -ne 'true') { throw "Startup task must be enabled by default: $($startupTask.Enabled)" }
          if ($startupTask.DisplayName -ne 'Doki-Dango') { throw "Unexpected startup display name: $($startupTask.DisplayName)" }

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package\windows\Build-Package.ps1
