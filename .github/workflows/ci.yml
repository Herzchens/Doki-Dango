name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected areas
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      run_dotnet: ${{ steps.detect.outputs.run_dotnet }}
      run_rust_harness: ${{ steps.detect.outputs.run_rust_harness }}
      run_host: ${{ steps.detect.outputs.run_host }}
      run_android: ${{ steps.detect.outputs.run_android }}
      run_package: ${{ steps.detect.outputs.run_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run detector self-tests
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Get-CiAffectedAreas.ps1 -SelfTest

      - name: Detect affected areas
        id: detect
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Get-CiAffectedAreas.ps1 `
            -BaseRef "${{ github.event.pull_request.base.sha || github.event.before }}" `
            -HeadSha "${{ github.event.pull_request.head.sha || github.sha }}" `
            -EventName "${{ github.event_name }}"

  validate:
    name: Parse and hygiene
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run CI required gate self-tests
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Test-CiRequired.ps1 -SelfTest

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\Test-PowerShellSyntax.ps1

      - name: Parse PowerShell with PowerShell 7
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Test-PowerShellSyntax.ps1

      - name: Check tracked-file and secret hygiene
        shell: pwsh
        run: |
          $trackedOutput = @(& git ls-files 2>&1)
          $lsFilesExit = $LASTEXITCODE
          if ($lsFilesExit -ne 0) {
              Write-Host "::error::git ls-files failed with exit code $lsFilesExit"
              exit 1
          }
          $tracked = @($trackedOutput | Where-Object { [string]::IsNullOrWhiteSpace($_) -eq $false })
          if ($tracked.Count -eq 0) {
              Write-Host '::error::git ls-files returned zero tracked files in repository.'
              exit 1
          }
          $forbidden = @(
              $tracked | Where-Object {
                  $_ -match '(^|/)(AGENTS\.md|PLAN\.md|google-services\.json)$' -or
                  $_ -match '\.(pfx|jks|keystore)$'
              }
          )

          if ($forbidden.Count -gt 0) {
              Write-Host '::error::Forbidden internal/secret-bearing files are tracked:'
              $forbidden | ForEach-Object {
                  Write-Host ("::error file={0}::{0}" -f $_)
              }
              exit 1
          }

          $privateKeyPattern = '-----BEGIN ' + '(RSA |EC |OPENSSH )?' + 'PRIVATE KEY-----'
          $apiKeyPattern = 'AI' + 'za[0-9A-Za-z_-]{20,}'
          $oauthPattern = 'ya' + '29\.[0-9A-Za-z._-]+'
          $secretPattern = "$privateKeyPattern|$apiKeyPattern|$oauthPattern"

          $matches = @(& git grep -I -n -E -- $secretPattern 2>$null)
          $grepExit = $LASTEXITCODE

          if ($grepExit -eq 0) {
              Write-Host '::error::Potential committed secret material detected.'
              $matches | ForEach-Object { Write-Host "::error::$_" }
              exit 1
          }

          if ($grepExit -ne 1) {
              throw "git grep failed with exit code $grepExit"
          }

          Write-Host 'Tracked-file and secret hygiene checks passed.'
          exit 0

      - name: Check repository boundaries
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Test-RepositoryBoundaries.ps1

  windows-dotnet-reference:
    name: Windows .NET reference build
    needs: detect
    if: needs.detect.outputs.run_dotnet == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'

      - name: Build Windows notification reference
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\spikes\notification-listener-dotnet\scripts\Build-Unpackaged.ps1

  android-fcm-harness:
    name: Android FCM harness build
    needs: detect
    if: needs.detect.outputs.run_android == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          cache: gradle

      - name: Install required Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) {
              $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
              $env:ANDROID_HOME
          } else {
              throw 'ANDROID_SDK_ROOT/ANDROID_HOME is not configured on the runner.'
          }

          $sdkManager = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'cmdline-tools') `
              -Recurse `
              -File `
              -Filter 'sdkmanager.bat' |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $sdkManager) {
              throw "sdkmanager.bat not found under $sdkRoot"
          }

          & $sdkManager.FullName `
              "--sdk_root=$sdkRoot" `
              'platform-tools' `
              'platforms;android-36.1' `
              'build-tools;36.1.0'

          if ($LASTEXITCODE -ne 0) {
              throw "sdkmanager failed with exit code $LASTEXITCODE"
          }

          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Android FCM harness
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\android\spikes\firebase-messaging\scripts\Build.ps1


  windows-rust-harness:
    name: Windows Rust notification harness build
    needs: detect
    if: needs.detect.outputs.run_rust_harness == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Install-RustToolchain.ps1 -Components rustfmt,clippy

      - name: Format and lint
        shell: pwsh
        run: |
          cargo fmt --manifest-path .\windows\spikes\notification-listener-rust\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .\windows\spikes\notification-listener-rust\Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Rust notification harness
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\spikes\notification-listener-rust\scripts\Build.ps1


  windows-host:
    name: Windows Host workspace
    needs: detect
    if: needs.detect.outputs.run_host == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Install-RustToolchain.ps1 -Components rustfmt,clippy

      - name: Format, lint, test, and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --workspace --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production FCM sender harness
        shell: pwsh
        run: |
          cargo build --locked --release -p doki-dango-host --example production_fcm_sender
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Credential protection runtime gate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\tests\credential-protection\Test-CredentialProtection.ps1


  windows-package:
    name: Windows package build
    needs: [detect, windows-host]
    if: needs.detect.outputs.run_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Install-RustToolchain.ps1

      - name: Validate package identity
        shell: pwsh
        run: |
          pwsh -File .\windows\tests\packaging\Test-PackageManifest.ps1

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\scripts\package\Build-Package.ps1

      - name: Validate versioned package build
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\tests\packaging\Test-VersionedPackageBuild.ps1

      - name: Generate release integrity metadata
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\scripts\release\New-ReleaseIntegrity.ps1 -SourceCommit $sourceCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\scripts\release\New-CargoSpdxSbom.ps1 -SourceCommit $sourceCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release integrity gates
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\tests\packaging\Test-ReleaseIntegrity.ps1

  ci-required:
    name: CI required
    needs:
      - detect
      - validate
      - windows-dotnet-reference
      - windows-rust-harness
      - windows-host
      - android-fcm-harness
      - windows-package
    runs-on: windows-latest
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run CI required gate self-tests
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Test-CiRequired.ps1 -SelfTest

      - name: Evaluate aggregate gate
        shell: pwsh
        run: |
          pwsh .\.github\scripts\Test-CiRequired.ps1 `
            -DetectResult "${{ needs.detect.result }}" `
            -ValidateResult "${{ needs.validate.result }}" `
            -ExpectationsJson '${{ toJSON(needs.detect.outputs) }}' `
            -ResultsJson '${{ toJSON(needs) }}'
